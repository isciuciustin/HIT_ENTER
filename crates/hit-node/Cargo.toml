[package]
name = "hit-node"
description = "One node, many roles: the endpoint, the hit/nostr/1 relay, binding-first authentication and sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# MIT, but never goes to crates.io.
publish = false
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
hit-event = { workspace = true }
hit-proto = { workspace = true, features = ["io"] }
hit-store = { workspace = true }
hit-group = { workspace = true }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
iroh-blobs = { workspace = true }
sha2 = { workspace = true }
bytes = { workspace = true }
n0-future = { workspace = true }
serde_json = { workspace = true }
nostr = { workspace = true }
negentropy = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
