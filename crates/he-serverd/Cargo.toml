[package]
name = "he-serverd"
description = "Headless HIT_ENTER server, for hosting a space without the desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "he-serverd"
path = "src/main.rs"

[dependencies]
he-proto = { workspace = true }
he-server = { workspace = true }
# `signal` so that ^C shuts the router down cleanly instead of dropping the
# endpoint out from under live sessions.
tokio = { workspace = true, features = ["signal"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
