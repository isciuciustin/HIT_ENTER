[package]
name = "he-server"
description = "HIT_ENTER server: iroh protocol handler, SQLite storage and authentication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
he-proto = { workspace = true, features = ["io", "net"] }
iroh = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
argon2 = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
subtle = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
# Integration tests link only against this crate's public API plus its
# dev-dependencies, so the two crates the tests speak in have to be named twice.
he-proto = { workspace = true }
iroh = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
