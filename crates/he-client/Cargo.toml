[package]
name = "he-client"
description = "HIT_ENTER client: dialing, connection management and the local message mirror."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
he-proto = { workspace = true, features = ["io"] }
iroh = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The end-to-end test dials a real server over two real iroh endpoints on
# loopback (PLAN §14). No mocks: a mock of a QUIC handshake proves nothing.
he-server = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
