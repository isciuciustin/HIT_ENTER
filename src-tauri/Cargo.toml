[package]
name = "hit-enter"
description = "HIT_ENTER — self-hosted, local-first group chat."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# Tauri v2 keeps the app in a library so mobile targets can link it; the
# binary below is a thin shim over `run()`.
name = "hit_enter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "hit-enter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
he-client = { workspace = true }
he-server = { workspace = true }
he-proto = { workspace = true }
iroh = { workspace = true }
tauri = { version = "2", features = [] }
# A clicked `hitenter://` link on Linux and Windows starts a second copy of the
# app with the URL as an argument; single-instance is what turns that back into
# "the window that is already open handles it".
# WebKitGTK refuses `navigator.clipboard.writeText` — silently, so a copy
# button looks like it worked and the clipboard stays empty. The invite link is
# the whole delivery mechanism for a space, so it goes through the plugin.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
