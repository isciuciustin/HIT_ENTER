[package]
name = "hit-enter"
description = "HIT_ENTER — self-hosted, local-first group chat."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# Tauri v2 keeps the app in a library so mobile targets can link it; the
# binary below is a thin shim over `run()`.
name = "hit_enter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "hit-enter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
he-client = { workspace = true }
he-server = { workspace = true }
he-proto = { workspace = true }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
