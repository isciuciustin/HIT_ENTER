[package]
name = "nostr-iroh-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately NOT a workspace member: this is a question, not a feature.
# S1 — can two apps be two Nostr relays over iroh, syncing with negentropy?

[dependencies]
# Pinned to the iroh HIT_ENTER_2's lock is on, so the answer is about the
# iroh the carried-over transport code actually runs on.
iroh = { version = "=1.1.0", features = ["tls-ring"] }
nostr = { version = "0.45", features = ["std", "os-rng"] }
negentropy = "0.5"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "io-util", "sync", "signal"] }
anyhow = "1.0"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tempfile = "3"

[workspace]
