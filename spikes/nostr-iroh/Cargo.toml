[package]
name = "nostr-iroh"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike: its own workspace, outside any product workspace.
[workspace]

[dependencies]
iroh = "1.3"
nostr = { version = "0.45", features = ["os-rng"] }
negentropy = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
