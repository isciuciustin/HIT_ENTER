[package]
name = "two-endpoints-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately NOT a workspace member: a question, not a feature.
# S5 — two iroh endpoints in one process, one of them relay-only. What does
# it cost, and does anything in iroh assume one endpoint per process?

[dependencies]
# Pinned to the version S1's first build and S2 settled on (gossip needs ≥ 1.3).
# `test-utils` runs a relay server; it pulls in axum, which is fine in a spike.
iroh = { version = "=1.3.0", features = ["test-utils"] }
iroh-relay = { version = "=1.3.0", default-features = false }  # only for RelayQuicConfig, which iroh does not re-export
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync"] }
anyhow = "1.0"

[workspace]
